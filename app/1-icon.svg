<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Warm editorial paper squircle with subtle hairline border -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="#FAF9F6" stroke="#E0E6E2" stroke-width="8"/>

  <!-- Soft sage halo behind the captured claim/cross -->
  <circle cx="256" cy="288" r="104" fill="#E8F1EC"/>

  <!-- Terracotta Medical Cross (built from the same 40x128 rounded bars) -->
  <rect x="236" y="224" width="40" height="128" rx="20" fill="#D47255"/>
  <rect x="192" y="268" width="128" height="40" rx="20" fill="#D47255"/>

  <!-- Claw hoist cable / stem -->
  <line x1="256" y1="84" x2="256" y2="152" stroke="#2D6A4F" stroke-width="36" stroke-linecap="round"/>

  <!-- Articulated mechanical grabber claw cradling the cross -->
  <path d="M 188 388 L 128 264 L 208 152 L 304 152 L 384 264 L 324 388" fill="none" stroke="#2D6A4F" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
